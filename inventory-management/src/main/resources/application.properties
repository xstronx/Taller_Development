spring.application.name=PintaAuto
# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/pintAutoSpring}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:5000}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:QwErTyUiOpAsDfGhJkLzXcVbNm123456}
app.jwt.expiration=${JWT_EXPIRATION:28800000}

# Admin Configuration
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.apellido=${ADMIN_APELLIDO:AdminpintaAuto}
app.admin.email=${ADMIN_EMAIL:admin@pintauto.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
